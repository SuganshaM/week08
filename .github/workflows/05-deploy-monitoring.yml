name: 05 - Deploy Monitoring

# Runs after 02 - Deploy to Staging succeeds. Monitoring is deployed once,
# cluster-wide (not per-namespace, unlike the app), because Prometheus
# needs to reach both the staging and production namespaces from a single
# place - see monitoring/servicemonitor-user-service.yaml, which is
# namespace-scoped per environment but discovered by the same Prometheus.
# It is intentionally decoupled from 03 - Test Staging / 04 - Deploy to
# Production: monitoring infrastructure existing or not does not gate
# whether the application itself is safe to promote.
on:
  workflow_run:
    workflows:
      - "02 - Deploy to Staging"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-monitoring:
    name: Deploy Prometheus & Grafana
    runs-on: ubuntu-latest

    if: >
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Create monitoring namespace
        run: |
          kubectl create namespace monitoring \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Add Prometheus community Helm repo
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Deploy kube-prometheus-stack (Prometheus + Grafana)
        run: |
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --values monitoring/values-kube-prometheus-stack.yaml \
            --set grafana.adminPassword="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            --wait \
            --timeout 10m

      - name: Apply Grafana dashboard
        run: |
          kubectl apply -f monitoring/dashboard-koalatech.yaml

      - name: Apply ServiceMonitor for user-service
        run: |
          kubectl apply -f monitoring/servicemonitor-user-service.yaml

      - name: Wait for Prometheus and Grafana rollout
        run: |
          kubectl rollout status statefulset/prometheus-monitoring-kube-prometheus-prometheus \
            -n monitoring --timeout=300s
          kubectl rollout status deployment/monitoring-grafana \
            -n monitoring --timeout=300s

      - name: Verify Prometheus targets and Grafana access
        run: |
          echo "Monitoring stack pods:"
          kubectl get pods -n monitoring
          echo
          echo "Grafana service (external IP may take a minute to appear):"
          kubectl get svc monitoring-grafana -n monitoring
          echo
          echo "ServiceMonitors registered:"
          kubectl get servicemonitor -A
